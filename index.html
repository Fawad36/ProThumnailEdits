<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Thumbnail Editor Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Tailwind CSS Base */
    *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
    html{line-height:1.5;-webkit-text-size-adjust:100%;-moz-tab-size:4;tab-size:4;font-family:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";font-feature-settings:normal;font-variation-settings:normal;-webkit-tap-highlight-color:transparent}
    body{margin:0;line-height:inherit}
    h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
    a{color:inherit;text-decoration:inherit}
    b,strong{font-weight:bolder}
    button,input,optgroup,select,textarea{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0}
    button,select{text-transform:none}
    button,[type=button],[type=reset],[type=submit]{-webkit-appearance:button;background-color:transparent;background-image:none}
    input::placeholder,textarea::placeholder{opacity:1;color:#9ca3af}
    button,[role=button]{cursor:pointer}
    :disabled{cursor:default}
    canvas{display:block;vertical-align:middle}
    img{max-width:100%;height:auto}
    [hidden]{display:none}

    /* Tailwind CSS Utilities (Optimized) */
    .absolute{position:absolute}
    .relative{position:relative}
    .sticky{position:sticky}
    .top-0{top:0}
    .top-2{top:.5rem}
    .bottom-2{bottom:.5rem}
    .right-2{right:.5rem}
    .z-10{z-index:10}
    .z-20{z-index:20}
    .mx-auto{margin-left:auto;margin-right:auto}
    .mb-2{margin-bottom:.5rem}
    .mb-4{margin-bottom:1rem}
    .mt-2{margin-top:.5rem}
    .mt-3{margin-top:.75rem}
    .mt-4{margin-top:1rem}
    .mb-3{margin-bottom:.75rem}
    .mt-1{margin-top:.25rem}
    .block{display:block}
    .flex{display:flex}
    .grid{display:grid}
    .hidden{display:none}
    .w-full{width:100%}
    .w-1\/2{width:50%}
    .flex-1{flex:1 1 0%}
    .max-w-7xl{max-width:80rem}
    .max-h-60{max-height:15rem}
    .min-w-40{min-width:10rem}
    .min-h-24{min-height:6rem}
    .max-w-2xl{max-width:42rem}
    .max-h-96{max-height:24rem}
    .cursor-move{cursor:move}
    .cursor-pointer{cursor:pointer}
    .grid-cols-1{grid-template-columns:repeat(1,minmax(0,1fr))}
    .grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-cols-8{grid-template-columns:repeat(8,minmax(0,1fr))}
    .gap-2{gap:.5rem}
    .gap-3{gap:.75rem}
    .gap-8{gap:2rem}
    .space-y-6>:not([hidden])~:not([hidden]){--tw-space-y-reverse:0;margin-top:calc(1.5rem * calc(1 - var(--tw-space-y-reverse)));margin-bottom:calc(1.5rem * var(--tw-space-y-reverse))}
    .overflow-hidden{overflow:hidden}
    .overflow-y-auto{overflow-y:auto}
    .rounded-lg{border-radius:.5rem}
    .rounded-xl{border-radius:.75rem}
    .border-2{border-width:2px}
    .border-4{border-width:4px}
    .border-solid{border-style:solid}
    .border-white{border-color:#fff}
    .bg-gray-200{background-color:#e5e7eb}
    .bg-gray-300{background-color:#d1d5db}
    .p-2{padding:.5rem}
    .px-4{padding-left:1rem;padding-right:1rem}
    .py-10{padding-top:2.5rem;padding-bottom:2.5rem}
    .px-8{padding-left:2rem;padding-right:2rem}
    .py-4{padding-top:1rem;padding-bottom:1rem}
    .px-2{padding-left:.5rem;padding-right:.5rem}
    .py-3{padding-top:.75rem;padding-bottom:.75rem}
    .text-center{text-align:center}
    .text-sm{font-size:.875rem;line-height:1.25rem}
    .text-3xl{font-size:1.875rem;line-height:2.25rem}
    .font-semibold{font-weight:600}
    .font-bold{font-weight:700}
    .text-gray-600{color:#4b5563}
    .text-gray-800{color:#1f2937}
    .text-white{color:#fff}
    .shadow-md{box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1)}
    .shadow-lg{box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1)}
    .transition{transition-property:color,background-color,border-color,text-decoration-color,fill,stroke,opacity,box-shadow,transform,filter,backdrop-filter;transition-timing-function:cubic-bezier(.4,0,.2,1);transition-duration:.15s}
    .hover\:bg-gray-300:hover{background-color:#d1d5db}
    .hover\:text-blue-700:hover{color:#1e40af}
    @media (min-width:1024px){
      .lg\:col-span-3{grid-column:span 3/span 3}
      .lg\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    }

    /* Custom Styles */
    :root {
      --bg-color: #1e40af;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      min-height: 100vh;
      padding: 0.5rem;
      color: #1f2937;
      overflow-x: hidden;
    }

    canvas {
      border: 4px solid #ffffff;
      border-radius: 16px;
      max-width: 100%;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      cursor: move;
      background: #f8fafc;
    }

    .canvas-container {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 0.5rem;
    }

    .control-group {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .control-group:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    }

    .control-group h3 {
      margin-bottom: 0.75rem;
      color: #1e40af;
      font-weight: 700;
      font-size: 1.1rem;
    }

    input, select, button {
      transition: all 0.3s ease;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      padding: 0.5rem;
      font-size: 0.875rem;
    }

    button {
      background: #1e40af;
      color: white;
      font-weight: 600;
      padding: 0.5rem 1rem;
    }

    button:hover {
      background: #1e3a8a;
      transform: scale(1.05);
    }

    .add-text-button {
      background: #0d9488;
      color: white;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 8px;
    }

    .add-text-button:hover {
      background: #0f766e;
      transform: scale(1.05);
    }

    .emoji-picker {
      max-height: 200px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      padding: 0.75rem;
      background: #f1f5f9;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .emoji-picker button {
      font-size: 1.5rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
    }

    .emoji-picker button:hover {
      background: #e2e8f0;
      border-radius: 8px;
    }

    .preview-container {
      border: 2px solid #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      background: #f8fafc;
      min-width: 120px;
      min-height: 67.5px;
      max-width: 240px;
      max-height: 135px;
      overflow: hidden;
      z-index: 20;
      touch-action: manipulation;
    }

    .preview-container canvas {
      width: 100%;
      height: 100%;
      border: none;
      box-shadow: none;
    }

    .resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 12px;
      height: 12px;
      background: #1e40af;
      border-radius: 4px;
      cursor: nwse-resize;
    }

    footer {
      background: linear-gradient(90deg, #1e40af, #3b82f6);
      color: white;
      padding: 1.5rem;
      text-align: center;
      border-radius: 16px;
      margin-top: 1.5rem;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
    }

    footer p {
      font-size: 1rem;
      margin: 0.25rem 0;
    }

    footer a {
      color: #bfdbfe;
      text-decoration: none;
      font-weight: 700;
    }

    footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .layer-item {
      background: #f1f5f9;
      padding: 0.5rem;
      margin: 0.25rem 0;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .layer-item:hover {
      background: #e2e8f0;
    }

    .layer-item button {
      background: none;
      color: #6b7280;
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      border: none;
      cursor: pointer;
    }

    .layer-item button:hover {
      color: #1e40af;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 0.75rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .navbar button {
      background: #1e40af;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
    }

    .navbar button:hover {
      background: #1e3a8a;
      transform: scale(1.05);
    }

    @media (max-width: 1024px) {
      body {
        padding: 0.25rem;
      }

      .canvas-container {
        position: static;
        padding: 0.25rem;
      }

      .preview-container {
        position: fixed;
        bottom: 0.5rem;
        right: 0.5rem;
        width: 40%;
        max-width: 200px;
        aspect-ratio: 16 / 9;
        margin: 0;
      }

      .resize-handle {
        display: none;
      }

      .preview-container:not(.hidden) {
        display: block;
      }

      .navbar {
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .navbar .flex {
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
      }

      .control-group {
        padding: 0.75rem;
      }

      .grid-cols-4 {
        grid-template-columns: 1fr;
      }

      .max-w-7xl {
        max-width: 100%;
      }
    }

    @media (min-width: 1025px) {
      .preview-container {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        width: 240px;
        height: 135px;
        cursor: move;
      }
    }
  </style>
</head>
<body>
  <div class="max-w-7xl mx-auto">
    <!-- Navbar -->
    <div class="navbar">
      <h1 class="text-3xl font-bold text-gray-800">🎨 Thumbnail Editor Pro</h1>
      <div class="flex gap-3">
        <button onclick="undo()">Undo</button>
        <button onclick="redo()">Redo</button>
        <button onclick="downloadImage()">Download</button>
        <button onclick="resetCanvas()">Reset</button>
        <button onclick="togglePreview()">Show/Hide Preview</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      <!-- Canvas and Preview -->
      <div class="lg:col-span-3 canvas-container">
        <canvas id="canvas" width="1280" height="720" class="w-full mb-4"></canvas>
        <div class="preview-container" id="previewContainer">
          <canvas id="previewCanvas" width="240" height="135"></canvas>
          <div class="resize-handle"></div>
          <p class="text-sm text-white text-center mt-2">Real-Time Preview (Drag to Move, Resize with Corner - Desktop Only)</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="space-y-6">
        <!-- Appearance Controls -->
        <div class="control-group">
          <h3>Appearance</h3>
          <label class="text-sm text-gray-600 mt-3 block">Background Color</label>
          <select id="backgroundColor" class="w-full">
            <option value="#1e40af" selected>Blue</option>
            <option value="#000000">Black</option>
            <option value="#ffffff">White</option>
            <option value="#333333">Dark Gray</option>
            <option value="#e5e7eb">Light Gray</option>
            <option value="#0d9488">Teal</option>
          </select>
        </div>

        <!-- Image Controls -->
        <div class="control-group">
          <h3>Image</h3>
          <input id="url" type="text" placeholder="YouTube URL" class="w-full">
          <div class="flex gap-3 mt-3">
            <button onclick="loadThumbnail()" class="flex-1">Load Thumbnail</button>
            
            <input type="file" id="uploadImg" accept="image/*" class="flex-1">
          </div>
          
          <input type="file" id="internalImg" accept="image/*" class="w-full mt-3">
         
          <input type="file" id="customFont" accept=".ttf,.otf" class="w-full mt-3">
          <label class="text-sm text-gray-600 mt-3 block">Image Size</label>
          <input id="imgSize" type="range" min="50" max="500" value="200" class="w-full">
          <label class="text-sm text-gray-600 mt-3 block">Image Opacity</label>
          <input id="imgOpacity" type="range" min="0" max="1" step="0.1" value="1" class="w-full">
          <label class="text-sm text-gray-600 mt-3 block">Image Rotation (°)</label>
          <input id="imgRotation" type="range" min="0" max="360" value="0" class="w-full">
          <div class="mt-3">
            <h4 class="text-sm font-semibold text-gray-600">Move Image</h4>
            <div class="grid grid-cols-3 gap-2 mt-2">
              <button onclick="moveImage('up')" class="bg-blue-200 p-2 rounded-lg hover:bg-gray-300">↑</button>
              <button onclick="moveImage('left')" class="bg-blue-200 p-2 rounded-lg hover:bg-gray-300">←</button>
              <button onclick="moveImage('right')" class="bg-blue-200 p-2 rounded-lg hover:bg-gray-300">→</button>
              <div></div>
              <button onclick="moveImage('down')" class="bg-blue-200 p-2 rounded-lg hover:bg-gray-300">↓</button>
              <div></div>
            </div>
          </div>
        </div>

        <!-- Text Controls -->
        <div class="control-group">
          <h3>Text</h3>
          <select id="template" class="w-full mb-3">
            <option value="">Select Template</option>
            <option value="bold">Bold Impact</option>
            <option value="minimal">Minimal Clean</option>
            <option value="vibrant">Vibrant Pop</option>
          </select>
          <div id="textInputs">
            <div class="text-input-group mb-4">
              <input type="text" class="overlayText w-full" placeholder="Enter Text">
              <div class="flex gap-3 mt-3">
                <input type="color" class="textColor w-1/2" value="#ffffff">
                <input type="color" class="textBgColor w-1/2" value="#000000">
              </div>
              <label class="text-sm text-gray-600 mt-3 block">Use Gradient Background</label>
              <input type="checkbox" class="useGradient mt-1">
              <label class="text-sm text-gray-600 mt-3 block">Glow Effect</label>
              <input type="range" class="glowSize w-full mt-1" min="0" max="20" value="0">
              <select class="fontFamily w-full mt-3">
                <option value="Inter">Inter</option>
                <option value="Arial">Arial</option>
                <option value="Roboto">Roboto</option>
                <option value="Georgia">Georgia</option>
              </select>
              <select class="fontStyle w-full mt-3">
                <option value="normal">Normal</option>
                <option value="bold">Bold</option>
                <option value="italic">Italic</option>
              </select>
              <input type="number" class="fontSize w-full mt-3" value="40" min="10" max="100">
              <input type="range" class="shadowSize w-full mt-3" min="0" max="20" value="0">
              <label class="text-sm text-gray-600">Text Shadow</label>
              <input type="range" class="strokeSize w-full mt-3" min="0" max="5" step="0.1" value="0">
              <label class="text-sm text-gray-600">Text Stroke</label>
              <div class="mt-3">
                <h4 class="text-sm font-semibold text-gray-600">Move Text</h4>
                <div class="grid grid-cols-3 gap-2 mt-2">
                  <button onclick="moveText(0, 'up')" class="bg-gray-200 p-2 rounded-lg hover:bg-gray-300">↑</button>
                  <button onclick="moveText(0, 'left')" class="bg-gray-200 p-2 rounded-lg hover:bg-gray-300">←</button>
                  <button onclick="moveText(0, 'right')" class="bg-gray-200 p-2 rounded-lg hover:bg-gray-300">→</button>
                  <div></div>
                  <button onclick="moveText(0, 'down')" class="bg-gray-200 p-2 rounded-lg hover:bg-gray-300">↓</button>
                  
                  <div></div>
                </div>
              </div>
            </div>
          </div>
          <button onclick="addTextInput()" class="w-full mt-3 add-text-button">Add New Text</button>
        </div>

        <!-- Emoji Controls -->
        <div class="control-group">
          <h3>Emojis</h3>
          <div id="emojiPicker" class="emoji-picker"></div>
          <label class="text-sm text-gray-600 mt-3 block">Emoji Size</label>
          <input id="emojiSize" type="range" min="20" max="200" value="40" class="w-full">
          <label class="text-sm text-gray-600 mt-3 block">Emoji Opacity</label>
          <input id="emojiOpacity" type="range" min="0" max="1" step="0.1" value="1" class="w-full">
          <div class="mt-3">
            <h4 class="text-sm font-semibold text-gray-600">Move Emoji</h4>
            <div class="grid grid-cols-3 gap-2 mt-2">
              <button onclick="moveEmoji('up')" class="bg-blue-200 p-2 rounded-lg hover:bg-gray-300">↑</button>
              <button onclick="moveEmoji('left')" class="bg-blue-200 p-2 rounded-lg hover:bg-gray-300">←</button>
              <button onclick="moveEmoji('right')" class="bg-blue-200 p-2 rounded-lg hover:bg-gray-300">→</button>
              <div></div>
              <button onclick="moveEmoji('down')" class="bg-blue-200 p-2 rounded-lg hover:bg-gray-300">↓</button>
              <div></div>
            </div>
          </div>
        </div>

        <!-- Layer Management -->
        <div class="control-group">
          <h3>Layers</h3>
          <div id="layerList" class="text-sm"></div>
        </div>

        <!-- Image Adjustments -->
        <div class="control-group">
          <h3>Adjustments</h3>
          <label class="text-sm text-gray-600">Brightness</label>
          <input id="brightness" type="range" min="0" max="200" value="100" class="w-full">
          <label class="text-sm text-gray-600">Contrast</label>
          <input id="contrast" type="range" min="0" max="200" value="100" class="w-full">
          <label class="text-sm text-gray-600">Saturation</label>
          <input id="saturation" type="range" min="0" max="200" value="100" class="w-full">
          <label class="text-sm text-gray-600">Grayscale</label>
          <input id="grayscale" type="range" min="0" max="100" value="0" class="w-full">
          <label class="text-sm text-gray-600">Sepia</label>
          <input id="sepia" type="range" min="0" max="100" value="0" class="w-full">
          <label class="text-sm text-gray-600">Blur</label>
          <input id="blur" type="range" min="0" max="10" value="0" step="0.1" class="w-full">
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <p>Designed & Developed by <span class="font-semibold">Fawad Ali</span></p>
      <p>Connect with me on <a href="https://wa.me/923413297208" target="_blank">WhatsApp</a></p>
      <p class="text-sm mt-2">Crafting Unique Thumbnails with Passion 🚀</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
